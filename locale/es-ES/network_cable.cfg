[entity-description]
network-terminal=Abre el terminal para gestionar los parámetros de la red y enviar cantidades de objetos a los cables.
network-server=Nodo central de la infraestructura de la red de objetos.
network-fluid-input=Colócalo en una línea de cable y conéctalo a tuberías para absorber fluidos en la red.
network-fluid-output=Colócalo en una línea de cable, conéctalo a tuberías y elige qué fluido debe expulsar.
network-buffer-chest=Conéctalo a la red cableada para llenar automáticamente las ranuras de solicitud desde el almacenamiento virtual y descargar las ranuras de basura de vuelta a la red.

