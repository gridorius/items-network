insert_item_stack_per_operation=Cuántas pilas de objetos transfiere cada operación de red a una máquina.
fill_turret_ammo=Permite que la red entregue munición automáticamente a las torretas conectadas.
use_energy=Determina si la red de objetos consume electricidad mientras funciona.

