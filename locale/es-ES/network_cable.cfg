[item-description]
network-cable=Se usa para construir una red de transporte de objetos. Después de investigar la conductividad eléctrica de la red, también puede conducir electricidad.
network-connector=El conector vincula entidades a la red, permitiéndoles interactuar con ella. (Máquinas, cofres, torretas, etc.)
network-terminal=Punto de acceso a la configuración de la red de objetos y a la salida a la red de circuitos.
network-inserter=Toma objetos del inventario virtual de la red y los entrega en la entidad o cinta de su posición de descarga según los filtros del manipulador.
network-bulk-inserter=Versión reforzada del manipulador de red para mover lotes mayores de objetos filtrados desde el almacenamiento virtual.
network-unloading-train-stop=Descarga los vagones de los trenes acoplados y reposta las locomotoras desde la red de objetos.
network-server=Servidor central de la red de objetos.
network-fluid-input=Se conecta a tuberías de fluidos y bombea su contenido al almacenamiento virtual de la red.
network-fluid-output=Envía el fluido seleccionado desde el almacenamiento virtual de la red a las tuberías conectadas.
network-buffer-chest=Solicita objetos del inventario virtual de la red y devuelve el contenido de sus ranuras de basura a la red sin usar robots logísticos.

