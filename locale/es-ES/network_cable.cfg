[technology-description]
items-network=Desbloquea cables de red para mover objetos entre dispositivos conectados.
network-power-conductivity=Permite que la infraestructura de cables de red conduzca electricidad.
network-player-supply=Permite que los servidores de red satisfagan las solicitudes logísticas del jugador.
network-train-unloading=Desbloquea la estación de descarga de red después de investigar la estación de tren normal.

