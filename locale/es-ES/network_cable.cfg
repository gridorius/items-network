[entity-description]
network-terminal=Abre el terminal para gestionar la configuración de la red y enviar las cantidades de objetos a la red de circuitos.
network-inserter=Conéctalo a la red de cables, configura sus filtros y expulsará los objetos compatibles desde el almacenamiento virtual.
network-bulk-inserter=Conéctalo a la red de cables, configura sus filtros y expulsará lotes mayores de objetos compatibles desde el almacenamiento virtual.
network-unloading-train-stop=Conéctala a la red de cables para descargar los vagones de los trenes acoplados y rellenar de combustible las locomotoras.
network-server=Nodo principal de la infraestructura de la red de objetos.
network-fluid-input=Colócalo en línea con los cables de red y conéctalo a tuberías para introducir fluidos en la red.
network-fluid-output=Colócalo en línea con los cables de red, conéctalo a tuberías y elige qué fluido quieres sacar.
network-buffer-chest=Conéctalo a la red de cables para llenar solicitudes automáticamente desde el almacenamiento virtual y devolver las ranuras de basura a la red.
network-storage-chest=Almacenamiento interno de la red de objetos.

