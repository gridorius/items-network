[item-description]
network-cable=Se usa para construir una red cableada de transferencia de objetos.
network-connector=Conector auxiliar oculto que se usa para mantener intactos los enlaces de la red cableada.
network-absorber-cable=Absorbe objetos de los cofres en contacto y los transfiere al inventario virtual de la red.
network-terminal=Punto de acceso para los controles de la red de objetos y la salida de señales lógicas.
network-server=Servidor central de la red de objetos.
network-fluid-input=Se conecta a tuberías de fluido y bombea el contenido de su caja de fluidos al almacenamiento virtual de la red.
network-fluid-output=Envía un fluido seleccionado desde el almacenamiento virtual de la red a las tuberías conectadas.
network-buffer-chest=Solicita objetos del inventario virtual de la red y devuelve el contenido de sus ranuras de basura a la red sin usar robots logísticos.

