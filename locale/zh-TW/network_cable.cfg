[entity-description]
network-terminal=開啟終端以管理網路設定，並將物品數量輸出到電路網路。
network-inserter=將其接入電纜網路並設定過濾器後，它會從虛擬儲存中輸出符合條件的物品。
network-bulk-inserter=將其接入電纜網路並設定過濾器後，它會從虛擬儲存中輸出更大批量的符合條件物品。
network-server=物品網路基礎設施的主節點。
network-fluid-input=將它放在線路中的網路電纜上，並連接到管線以把流體拉入網路。
network-fluid-output=將它放在線路中的網路電纜上，連接到管線，並選擇要輸出的流體。
network-buffer-chest=將其連接到電纜網路後，可自動從虛擬儲存填滿請求，並把垃圾欄內容送回網路。
network-storage-chest=物品網路的內部儲存。

