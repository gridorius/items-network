[mod-setting-description]
network_machines_per_tick=每個網路在一個 tick 內處理多少已連接的機器。
insert_fluid_per_operation=每次網路操作向機器傳輸多少流體。
insert_item_stack_per_operation=每次網路操作向機器傳輸多少物品堆。
fill_turret_ammo=允許網路自動向已連接的炮塔運送彈藥。
use_energy=決定物品網路在運作時是否消耗電力。

