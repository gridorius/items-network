[item-description]
network-cable=用於建立物品運輸網路。研究網路導電技術後，它也能傳輸電力。
network-connector=連接器可將實體接入網路，讓它們能與網路互動。（機器、箱子、炮塔等。）
network-terminal=用於存取物品網路設定並輸出到電路網路的終端。
network-inserter=依照機械臂過濾器，從網路虛擬庫存取出物品並送入其投放位置上的實體或輸送帶。
network-bulk-inserter=網路機械臂的強化版本，可依過濾條件從虛擬庫存輸出更大批量的物品。
network-server=物品網路的中央伺服器。
network-fluid-input=連接到流體管線，並將其中的流體抽送到網路的虛擬儲存中。
network-fluid-output=將所選流體從網路的虛擬儲存輸出到已連接的管線中。
network-buffer-chest=從網路的虛擬庫存中請求物品，並在不使用物流機器人的情況下將垃圾欄內容送回網路。

