[item-name]
network-cable=網路電纜
network-underground-cable=地下網路電纜
network-connector=網路連接器
network-absorber-cable=吸收型網路電纜
network-terminal=網路終端
network-server=網路伺服器
network-fluid-input=網路流體輸入管
network-fluid-output=網路流體輸出管
network-buffer-chest=網路緩衝箱

[item-description]
network-cable=用於建造物品傳輸電纜網路。研究網路導電後，它也可以傳導電力。
network-underground-cable=網路電纜的地下版本。可穿過障礙連接兩個端點，同時保持網路與電力的連續性。
network-connector=用於保持電纜網路連線完整的隱藏輔助連接器。
network-absorber-cable=從接觸的箱子中吸收物品並將其傳送到網路虛擬庫存中。
network-terminal=用於存取物品網路控制和邏輯訊號輸出的終端。
network-server=物品網路的中央伺服器。
network-fluid-input=連接流體管線並將其流體箱中的內容泵入網路虛擬儲存。
network-fluid-output=將選定的流體從網路虛擬儲存輸出到已連接的管線。
network-buffer-chest=從網路虛擬庫存請求物品，並在不使用物流機器人的情況下將垃圾欄中的物品送回網路。

[entity-name]
network-terminal=網路終端
network-server=網路伺服器
network-fluid-input=網路流體輸入管
network-fluid-output=網路流體輸出管
network-buffer-chest=網路緩衝箱

[entity-description]
network-terminal=打開終端以管理網路參數並將物品數量輸出到電路網路。
network-server=物品網路基礎設施的核心節點。
network-fluid-input=將其放在電纜線上並連接到管線，以將流體吸入網路。
network-fluid-output=將其放在電纜線上，連接到管線，並選擇要輸出的流體。
network-buffer-chest=將其連接到電纜網路，以從虛擬儲存自動填充請求欄，並將垃圾欄中的物品卸回網路。

