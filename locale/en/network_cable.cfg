[entity-description]
network-terminal=Open the terminal to manage network parameters and output item counts to wires.
network-server=Core node of the item network infrastructure.
network-fluid-input=Place it in a cable line and connect it to pipes to absorb fluids into the network.
network-fluid-output=Place it in a cable line, connect it to pipes, and choose which fluid it should output.
network-buffer-chest=Connect it to the cable network to auto-fill request slots from virtual storage and unload trash slots back into the network.

