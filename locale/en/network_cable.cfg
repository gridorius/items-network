[item-description]
network-cable=Used to build an item transfer cable network.
network-absorber-cable=Absorbs items from touching chests and transfers them into the network virtual inventory.
network-terminal=Access point for item network controls and logical signal output.
network-server=Central server for the item network.
network-fluid-input=Connects to fluid pipes and pumps the contents of its fluidbox into the network virtual storage.
network-fluid-output=Pushes a selected fluid from the network virtual storage into connected pipes.
network-buffer-chest=Requests items from the network virtual inventory and sends its trash slots back into the network without using logistic robots.

