[item-description]
network-cable=Used to build an item transport network. After researching network power conductivity, it can also carry electricity.
network-connector=The connector links entities to the network, allowing them to interact with it. (Machines, chests, turrets, etc.)
network-terminal=Access point for item network settings and circuit network output.
network-server=Central server of the item network.
network-fluid-input=Connects to fluid pipes and pumps their contents into the network's virtual storage.
network-fluid-output=Outputs the selected fluid from the network's virtual storage into connected pipes.
network-buffer-chest=Requests items from the network's virtual inventory and sends the contents of its trash slots back into the network without logistic robots.

