[item-description]
network-cable=Utilisé pour construire un réseau de transport d'objets. Après avoir recherché la conductivité électrique du réseau, il peut aussi conduire l'électricité.
network-connector=Le connecteur relie des entités au réseau, ce qui leur permet d'interagir avec lui. (Machines, coffres, tourelles, etc.)
network-terminal=Point d'accès aux paramètres du réseau d'objets et à la sortie vers le réseau de circuits.
network-inserter=Prend des objets depuis l'inventaire virtuel du réseau et les dépose dans l'entité ou sur le tapis à sa position de dépôt selon ses filtres.
network-bulk-inserter=Version renforcée du bras réseau pour déplacer de plus grands lots d'objets filtrés depuis le stockage virtuel.
network-unloading-train-stop=Décharge les wagons des trains à quai et ravitaille les locomotives en carburant depuis le réseau d'objets.
network-server=Serveur central du réseau d'objets.
network-fluid-input=Se connecte aux tuyaux de fluide et pompe leur contenu dans le stockage virtuel du réseau.
network-fluid-output=Envoie le fluide sélectionné depuis le stockage virtuel du réseau vers les tuyaux connectés.
network-buffer-chest=Demande des objets depuis l'inventaire virtuel du réseau et renvoie le contenu de ses emplacements de déchets au réseau sans robots logistiques.

