[mod-setting-description]
network_machines_per_tick=Combien de machines connectées chaque réseau traite en un tick.
insert_fluid_per_operation=Quelle quantité de fluide chaque opération du réseau transfère dans une machine.
insert_item_stack_per_operation=Combien de piles d'objets chaque opération du réseau transfère dans une machine.
fill_turret_ammo=Permet au réseau de livrer automatiquement des munitions aux tourelles connectées.
use_energy=Détermine si le réseau d'objets consomme de l'électricité pendant son fonctionnement.

