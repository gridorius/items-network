[technology-description]
items-network=Débloque les câbles réseau pour déplacer des objets entre des appareils connectés.
network-power-conductivity=Permet à l'infrastructure des câbles réseau de conduire l'électricité.
network-player-supply=Permet aux serveurs réseau de satisfaire les demandes logistiques du joueur.
network-train-unloading=Débloque la station de déchargement réseau après la recherche de la gare ferroviaire normale.

