[entity-description]
network-terminal=Ouvrez le terminal pour gérer les paramètres du réseau et envoyer les quantités d'objets sur le réseau de circuits.
network-inserter=Connectez-le au réseau câblé, réglez ses filtres et il sortira les objets correspondants depuis le stockage virtuel.
network-bulk-inserter=Connectez-le au réseau câblé, réglez ses filtres et il sortira de plus grands lots d'objets correspondants depuis le stockage virtuel.
network-unloading-train-stop=Connectez-la au réseau câblé pour décharger les wagons des trains à quai et remplir les locomotives en carburant.
network-server=Nœud principal de l'infrastructure du réseau d'objets.
network-fluid-input=Placez-le en ligne avec les câbles réseau et connectez-le à des tuyaux pour aspirer les fluides dans le réseau.
network-fluid-output=Placez-le en ligne avec les câbles réseau, connectez-le à des tuyaux et choisissez le fluide à sortir.
network-buffer-chest=Connectez-le au réseau câblé pour remplir automatiquement les demandes depuis le stockage virtuel et renvoyer les emplacements de déchets au réseau.
network-storage-chest=Stockage interne du réseau d'objets.

