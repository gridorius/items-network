network-fluid-output=Placez-le sur une ligne de câbles, connectez-le à des tuyaux et choisissez le fluide à sortir.
network-buffer-chest=Connectez-le au réseau câblé pour remplir automatiquement les emplacements de demande depuis le stockage virtuel et renvoyer les emplacements de déchets dans le réseau.

