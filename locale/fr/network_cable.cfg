[item-description]
network-cable=Utilisé pour construire un réseau câblé de transfert d'objets.
network-connector=Connecteur auxiliaire caché utilisé pour maintenir intactes les liaisons du réseau câblé.
network-absorber-cable=Absorbe les objets des coffres en contact et les transfère dans l'inventaire virtuel du réseau.
network-terminal=Point d'accès aux commandes du réseau d'objets et à la sortie des signaux logiques.
network-server=Serveur central du réseau d'objets.
network-fluid-input=Se connecte aux tuyaux de fluide et pompe le contenu de sa boîte de fluide dans le stockage virtuel du réseau.
network-fluid-output=Envoie un fluide sélectionné du stockage virtuel du réseau vers les tuyaux connectés.
network-buffer-chest=Demande des objets à l'inventaire virtuel du réseau et renvoie le contenu de ses emplacements de déchets dans le réseau sans utiliser de robots logistiques.

