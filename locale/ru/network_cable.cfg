[entity-description]
network-terminal=Откройте терминал, чтобы управлять параметрами сети и выводить количество предметов в сигнальную сеть.
network-server=Главный узел инфраструктуры сети предметов. 
network-fluid-input=Ставьте в линию сетевых кабелей и подключайте к трубам, чтобы забирать жидкости в сеть.
network-fluid-output=Ставьте в линию сетевых кабелей, подключайте к трубам и выбирайте жидкость для вывода.
network-buffer-chest=Подключите к кабельной сети, чтобы автоматически заполнять запросы из виртуального хранилища и выгружать мусорные ячейки обратно в сеть.
network-storage-chest=Внутреннее хранилище сети предметов.

