network_machines_per_tick=Машин, обрабатываемых за тик
insert_fluid_per_operation=Жидкости за операцию
insert_item_stack_per_operation=Стаков предметов за операцию
fill_turret_ammo=Пополнять боеприпасы турелей
use_energy=Потреблять электричество

[mod-setting-description]
network_machines_per_tick=Сколько подключенных машин каждая сеть обрабатывает за один тик.
insert_fluid_per_operation=Сколько жидкости каждая операция сети передает в машину.
insert_item_stack_per_operation=Сколько стаков предметов каждая операция сети передает в машину.
fill_turret_ammo=Разрешает сети автоматически доставлять боеприпасы в подключенные турели.
use_energy=Определяет, будет ли сеть предметов потреблять электричество для своей работы.

