[item-description]
network-cable=Используется для построения сети передачи предметов. После исследования технологии электропроводности сети также может проводить электричество.
network-connector=Коннектор подключает сущности к сети, позволяя им взаимодействовать с ней. (Машины, сундуки, турели и т.д.)
network-terminal=Точка доступа к настройкам сети предметов и выводу сигналов в сигнальную сеть.
network-server=Центральный сервер сети предметов. 
network-fluid-input=Подключается к трубам с жидкостью и перекачивает их содержимое в виртуальное хранилище сети.
network-fluid-output=Выводит выбранную жидкость из виртуального хранилища сети в подключенные трубы.
network-buffer-chest=Запрашивает предметы из виртуального инвентаря сети и отправляет содержимое своих мусорных ячеек обратно в сеть без участия логистических дронов.

