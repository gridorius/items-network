[technology-description]
items-network=Открывает возможность создания сетевых кабелей для передачи предметов между устройствами.
network-power-conductivity=Позволяет инфраструктуре сетевых кабелей проводить электричество.
network-player-supply=Позволяет сетевым серверам выполнять логистические запросы игроков.

