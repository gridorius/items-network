[item-description]
network-cable=Используется для построения сети передачи предметов.
network-connector=Скрытый служебный коннектор, который поддерживает целостность соединений кабельной сети.
network-absorber-cable=Поглощает предметы из касающихся сундуков и отправляет их в виртуальный инвентарь сети.
network-terminal=Точка доступа к настройкам сети предметов и логическому выводу сигналов.
network-server=Центральный сервер сети предметов. (Невозможно удалить, пока в сети есть предметы.)
network-fluid-input=Подключается к трубам с жидкостью и перекачивает содержимое своей fluidbox в виртуальное хранилище сети.
network-fluid-output=Выводит выбранную жидкость из виртуального хранилища сети в подключенные трубы.
network-buffer-chest=Запрашивает предметы из виртуального инвентаря сети и отправляет содержимое своих мусорных ячеек обратно в сеть без участия логистических дронов.

