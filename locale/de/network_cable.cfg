insert_fluid_per_operation=Flüssigkeit pro Operation
insert_item_stack_per_operation=Gegenstandsstapel pro Operation
fill_turret_ammo=Geschützturm-Munition nachfüllen
use_energy=Strom verbrauchen

[mod-setting-description]
network_machines_per_tick=Wie viele verbundene Maschinen jedes Netzwerk in einem Tick verarbeitet.
insert_fluid_per_operation=Wie viel Flüssigkeit jede Netzwerkoperation in eine Maschine überträgt.
insert_item_stack_per_operation=Wie viele Gegenstandsstapel jede Netzwerkoperation in eine Maschine überträgt.
fill_turret_ammo=Erlaubt dem Netzwerk, automatisch Munition zu verbundenen Geschütztürmen zu liefern.
use_energy=Legt fest, ob das Gegenstandsnetzwerk während des Betriebs Strom verbraucht.

