[entity-description]
network-terminal=Öffne das Terminal, um Netzwerkparameter zu verwalten und Gegenstandsmengen auf Leitungen auszugeben.
network-server=Kernknoten der Infrastruktur des Item-Netzwerks.
network-fluid-input=Platziere es in einer Kabelleitung und verbinde es mit Rohren, um Fluide in das Netzwerk aufzunehmen.
network-fluid-output=Platziere es in einer Kabelleitung, verbinde es mit Rohren und wähle das auszugebende Fluid.
network-buffer-chest=Verbinde sie mit dem Kabelnetzwerk, um Anforderungsplätze automatisch aus dem virtuellen Speicher zu füllen und Müllslots zurück ins Netzwerk zu entladen.

