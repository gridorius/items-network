[item-description]
network-cable=Wird zum Aufbau eines Kabelnetzwerks für den Item-Transfer verwendet.
network-connector=Versteckter Hilfsverbinder, der die Verbindungen des Kabelnetzwerks intakt hält.
network-absorber-cable=Nimmt Gegenstände aus berührenden Kisten auf und überträgt sie in das virtuelle Inventar des Netzwerks.
network-terminal=Zugangspunkt für die Steuerung des Item-Netzwerks und die Ausgabe logischer Signale.
network-server=Zentraler Server für das Item-Netzwerk.
network-fluid-input=Verbindet sich mit Fluidrohren und pumpt den Inhalt seiner Fluidbox in den virtuellen Netzwerkspeicher.
network-fluid-output=Leitet ein ausgewähltes Fluid aus dem virtuellen Netzwerkspeicher in verbundene Rohre.
network-buffer-chest=Fordert Gegenstände aus dem virtuellen Inventar des Netzwerks an und schickt den Inhalt seiner Müllslots ohne Logistikroboter zurück ins Netzwerk.

