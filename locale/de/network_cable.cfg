[technology-description]
items-network=Schaltet Netzwerkkabel frei, um Gegenstände zwischen verbundenen Geräten zu transportieren.
network-power-conductivity=Erlaubt der Netzwerkkabel-Infrastruktur, Strom zu leiten.
network-player-supply=Erlaubt Netzwerkservern, Logistikanforderungen von Spielern zu erfüllen.

