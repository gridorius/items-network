[item-description]
network-cable=Wird verwendet, um ein Gegenstandsnetzwerk aufzubauen. Nach Erforschung der Netzwerkstromleitung kann es auch Strom leiten.
network-connector=Der Verbinder verbindet Entitäten mit dem Netzwerk und ermöglicht ihnen die Interaktion damit. (Maschinen, Kisten, Geschütztürme usw.)
network-terminal=Zugangspunkt zu den Einstellungen des Gegenstandsnetzwerks und zur Ausgabe ins Schaltungsnetz.
network-inserter=Zieht Gegenstände aus dem virtuellen Inventar des Netzwerks und legt sie entsprechend den Filtereinstellungen in die Entität oder auf das Band an seiner Abgabeposition.
network-bulk-inserter=Leistungsstärkere Version des Netzwerkmanipulators, um größere Mengen gefilterter Gegenstände aus dem virtuellen Speicher auszugeben.
network-server=Zentraler Server des Gegenstandsnetzwerks.
network-fluid-input=Wird an Flüssigkeitsrohre angeschlossen und pumpt deren Inhalt in den virtuellen Speicher des Netzwerks.
network-fluid-output=Gibt die ausgewählte Flüssigkeit aus dem virtuellen Speicher des Netzwerks in angeschlossene Rohre aus.
network-buffer-chest=Fordert Gegenstände aus dem virtuellen Inventar des Netzwerks an und sendet den Inhalt seiner Müllplätze ohne Logistikroboter zurück ins Netzwerk.

