[entity-description]
network-terminal=Öffne das Terminal, um Netzwerkeinstellungen zu verwalten und Gegenstandsmengen ins Schaltungsnetz auszugeben.
network-inserter=Mit dem Kabelnetz verbinden, Filter setzen und passende Gegenstände aus dem virtuellen Speicher ausgeben.
network-bulk-inserter=Mit dem Kabelnetz verbinden, Filter setzen und größere Stapel passender Gegenstände aus dem virtuellen Speicher ausgeben.
network-server=Hauptknoten der Infrastruktur des Gegenstandsnetzwerks.
network-fluid-input=In die Linie der Netzwerkkabel setzen und mit Rohren verbinden, um Flüssigkeiten in das Netzwerk zu ziehen.
network-fluid-output=In die Linie der Netzwerkkabel setzen, mit Rohren verbinden und die auszugebende Flüssigkeit wählen.
network-buffer-chest=Mit dem Kabelnetz verbinden, um Anforderungen automatisch aus dem virtuellen Speicher zu füllen und Müllplätze zurück ins Netzwerk zu entladen.
network-storage-chest=Interner Speicher des Gegenstandsnetzwerks.

