[mod-setting-description]
network_machines_per_tick=每个网络在一个 tick 内处理多少已连接机器。
insert_fluid_per_operation=每次网络操作向机器传输多少流体。
insert_item_stack_per_operation=每次网络操作向机器传输多少物品堆。
fill_turret_ammo=允许网络自动向已连接的炮塔运送弹药。
use_energy=决定物品网络在运行时是否消耗电力。

