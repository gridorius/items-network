[item-description]
network-cable=用于建造物品传输电缆网络。
network-connector=用于保持电缆网络连接完整的隐藏辅助连接器。
network-absorber-cable=从接触的箱子中吸收物品并将其传送到网络虚拟库存中。
network-terminal=用于访问物品网络控制和逻辑信号输出的终端。
network-server=物品网络的中央服务器。
network-fluid-input=连接流体管道并将其流体箱中的内容泵入网络虚拟存储。
network-fluid-output=将选定的流体从网络虚拟存储输出到已连接的管道。
network-buffer-chest=从网络虚拟库存请求物品，并在不使用物流机器人的情况下将垃圾栏中的物品送回网络。

