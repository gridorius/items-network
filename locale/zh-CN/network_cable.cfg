[entity-description]
network-terminal=打开终端以管理网络设置，并将物品数量输出到电路网络。
network-inserter=将其接入电缆网络，设置过滤器后，它会从虚拟存储中输出匹配物品。
network-bulk-inserter=将其接入电缆网络，设置过滤器后，它会从虚拟存储中输出更大批量的匹配物品。
network-unloading-train-stop=将其接入电缆网络后，可卸载已进站列车的车厢，并为机车补充燃料。
network-server=物品网络基础设施的主节点。
network-fluid-input=将其放在线路中的网络电缆上，并连接到管道以将流体拉入网络。
network-fluid-output=将其放在线路中的网络电缆上，连接到管道，并选择要输出的流体。
network-buffer-chest=将其连接到电缆网络后，可自动从虚拟存储中填充请求，并将垃圾栏内容回送到网络。
network-storage-chest=物品网络的内部存储。

