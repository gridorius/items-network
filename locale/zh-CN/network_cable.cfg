[entity-description]
network-terminal=打开终端以管理网络参数并将物品数量输出到电路网络。
network-server=物品网络基础设施的核心节点。
network-fluid-input=将其放在电缆线上并连接到管道，以将流体吸入网络。
network-fluid-output=将其放在电缆线上，连接到管道，并选择要输出的流体。
network-buffer-chest=将其连接到电缆网络，以从虚拟存储自动填充请求栏，并将垃圾栏中的物品卸回网络。

