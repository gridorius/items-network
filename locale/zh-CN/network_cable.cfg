[item-description]
network-cable=用于构建物品运输网络。研究网络导电技术后，它也可以传输电力。
network-connector=连接器可将实体接入网络，使其能够与网络交互。（机器、箱子、炮塔等。）
network-terminal=用于访问物品网络设置并输出到电路网络的终端。
network-inserter=按机械臂过滤器从网络虚拟库存中取出物品，并将其送入投放位置上的实体或传送带。
network-bulk-inserter=网络机械臂的强化版本，可按过滤条件从虚拟库存中输出更大批量的物品。
network-unloading-train-stop=可卸载已进站列车的车厢，并从物品网络为机车补充燃料。
network-server=物品网络的中央服务器。
network-fluid-input=连接到流体管道，并将其中的流体泵入网络的虚拟存储。
network-fluid-output=将所选流体从网络的虚拟存储输出到已连接的管道中。
network-buffer-chest=从网络的虚拟库存中请求物品，并在不使用物流机器人的情况下将垃圾栏内容送回网络。

