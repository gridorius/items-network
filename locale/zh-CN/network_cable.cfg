[technology-description]
items-network=解锁网络电缆，用于在已连接设备之间传送物品。
network-power-conductivity=使网络电缆基础设施能够传导电力。
network-player-supply=允许网络服务器满足玩家的物流请求。
network-train-unloading=在研究普通火车站之后解锁网络卸货车站。

